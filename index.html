<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba de compartir</title>
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #F4F6F0; color: #1e2513; }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p { font-size: 13px; margin: 4px 0 12px; }
    button { display: block; width: 100%; padding: 14px; margin: 8px 0; font-size: 15px; font-weight: 700;
             background: #43522f; color: #fff; border: 0; border-radius: 12px; }
    button:disabled { background: #9aa58a; }
    pre { background: #fff; padding: 10px; border-radius: 10px; font-size: 12px; white-space: pre-wrap; word-break: break-word; min-height: 120px; }
    .info { font-size: 11px; color: #3d492c; word-break: break-word; }
  </style>
</head>
<body>
  <h1>Prueba de compartir 2 (temporal)</h1>
  <p>Pulsa cada botón por separado y dime cuáles funcionan (se abre el menú) y cuáles dan error. Al terminar, copia o haz captura del recuadro de resultados.</p>

  <button id="b1" disabled>A. XLSX con tipo "octet-stream"</button>
  <button id="b2" disabled>B. XLSX sin tipo declarado</button>
  <button id="b3" disabled>C. Mismo Excel con nombre .xls</button>
  <button id="b4" disabled>D. Excel dentro de un .ZIP</button>
  <button id="b5" disabled>E. Archivo .CSV</button>
  <button id="b6" disabled>F. Archivo .PDF</button>

  <p class="info" id="info"></p>
  <pre id="log">Resultados:
</pre>

<script>
  const XLSX_MIME = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  const log = document.getElementById('log');
  const say = (m) => { log.textContent += m + "\n"; };
  const files = {};

  document.getElementById('info').textContent =
    "HTTPS: " + window.isSecureContext +
    " | PWA: " + window.matchMedia('(display-mode: standalone)').matches +
    " | share: " + !!navigator.share + " | canShare: " + !!navigator.canShare +
    " | " + navigator.userAgent;

  // IMPORTANTE: sin ningún await antes de share(), para no perder el toque del usuario
  function runShare(label, data) {
    let can = 'sin canShare';
    try { if (navigator.canShare) can = navigator.canShare(data); } catch (e) { can = 'error ' + e.name; }
    say("[" + label + "] canShare=" + can);
    try {
      navigator.share(data)
        .then(() => say("[" + label + "] OK (se abrió el menú)"))
        .catch(e => say("[" + label + "] ERROR " + e.name + ": " + e.message));
    } catch (e) {
      say("[" + label + "] ERROR inmediato " + e.name + ": " + e.message);
    }
  }

  function enable(id, handler) {
    const b = document.getElementById(id);
    b.disabled = false;
    b.addEventListener('click', handler);
  }

  (async function () {
    try {
      const wb = new ExcelJS.Workbook();
      const ws = wb.addWorksheet('Prueba');
      ws.getCell('A1').value = 'Hola';
      ws.getCell('B1').value = 123;
      const buf = await wb.xlsx.writeBuffer();
      say("Excel de prueba listo (" + buf.byteLength + " bytes)");

      files.a = new File([buf], "prueba.xlsx", { type: "application/octet-stream" });
      enable('b1', () => runShare('A xlsx octet-stream', { files: [files.a] }));

      files.b = new File([buf], "prueba.xlsx", { type: "" });
      enable('b2', () => runShare('B xlsx sin tipo', { files: [files.b] }));

      files.c = new File([buf], "prueba.xls", { type: "application/vnd.ms-excel" });
      enable('b3', () => runShare('C .xls', { files: [files.c] }));

      if (window.JSZip) {
        const zip = new JSZip();
        zip.file("prueba.xlsx", buf);
        const zbuf = await zip.generateAsync({ type: "uint8array" });
        files.d = new File([zbuf], "prueba.zip", { type: "application/zip" });
        enable('b4', () => runShare('D zip', { files: [files.d] }));
      } else {
        say("JSZip no se pudo cargar: el botón D no está disponible");
      }
    } catch (e) {
      say("No se pudo crear el Excel de prueba: " + e.message);
    }
  })();

  files.e = new File(["col1;col2\nHola;123\n"], "prueba.csv", { type: "text/csv" });
  enable('b5', () => runShare('E csv', { files: [files.e] }));

  const pdfTxt = "%PDF-1.1\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 200 200]>>endobj\ntrailer<</Root 1 0 R>>\n%%EOF";
  files.f = new File([pdfTxt], "prueba.pdf", { type: "application/pdf" });
  enable('b6', () => runShare('F pdf', { files: [files.f] }));

</script>
</body>
</html>
